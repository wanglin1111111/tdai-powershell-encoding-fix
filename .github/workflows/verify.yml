# 可执行验证门槛的强制门禁（对应 VeriSkill Stage3 的自动化准入）。
# 每次 push / PR 自动跑离线验证门槛；不通过（exit 1）则阻断合并。
# Windows runner 额外跑 PowerShell Pester 测试，覆盖 PS5.1 路径。

name: verify

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  verify-node:
    name: 验证门槛 (Node, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: 运行可执行验证门槛（VeriSkill Stage3）
        run: node validation/verify.mjs

  verify-powershell:
    name: PowerShell Pester (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Pester（若不存在）
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester)) {
            Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester
          $pester = (Get-Module -ListAvailable Pester | Select-Object -First 1).Version.ToString()
          Write-Host "Pester version: $pester"
      - name: 启动 mock-gateway 后台
        shell: pwsh
        run: |
          # 用 Node 启动 mock-gateway（Pester 依赖它做往返）。
          # 用 Start-Process 启动真正的独立后台进程（Start-Job 创建的 PS 后台 job 在
          # Windows runner 上不可靠，曾出现 node 根本未绑定端口就超时的情况）。
          $gwLog = Join-Path $env:RUNNER_TEMP "mock-gateway.log"
          $proc = Start-Process -FilePath "node" `
            -ArgumentList "validation/mock-gateway.mjs","8420" `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput $gwLog `
            -RedirectStandardError "$gwLog.err"
          # 记录 PID 到 GITHUB_ENV，供后续停止步骤使用
          "GATEWAY_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "gateway started, PID=$($proc.Id)"
          # 重试轮询健康检查（最多 ~30s），等 node 绑定端口
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 1000
            try {
              $h = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8420/__echo" `
                -Method POST -Body '{"text":"ping"}' -ContentType "application/json; charset=utf-8" -TimeoutSec 3
              Write-Host "gateway up: $($h.StatusCode) (after ${i}s)"
              $ready = $true
              break
            } catch {
              # 还没起来，继续轮询
            }
          }
          if (-not $ready) {
            Write-Host "--- mock-gateway stdout ---"; if (Test-Path $gwLog) { Get-Content $gwLog -ErrorAction SilentlyContinue }
            Write-Host "--- mock-gateway stderr ---"; if (Test-Path "$gwLog.err") { Get-Content "$gwLog.err" -ErrorAction SilentlyContinue }
            Write-Error "mock-gateway 启动后 30s 仍未就绪"
            exit 1
          }
      - name: 运行 Pester 测试
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $cfg = New-PesterConfiguration
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.Should.ErrorAction = 'Continue'
          Invoke-Pester -Configuration $cfg
      - name: 停止 mock-gateway
        if: always()
        shell: pwsh
        run: |
          # 按 PID 停止 Start-Process 启动的 node 进程
          if ($env:GATEWAY_PID) {
            Stop-Process -Id $env:GATEWAY_PID -Force -ErrorAction SilentlyContinue
            Write-Host "stopped gateway PID=$env:GATEWAY_PID"
          }
